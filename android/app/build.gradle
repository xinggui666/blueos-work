plugins {
    id "com.android.application"
}

// 正式签名不进仓库。按顺序读取：
// 1. 环境变量 BLUEOS_KEYSTORE_FILE / BLUEOS_KEYSTORE_PASSWORD / BLUEOS_KEY_ALIAS / BLUEOS_KEY_PASSWORD（CI 用 Secrets 注入）
// 2. android/keystore.properties（已在 .gitignore，本地打包用）
// 都没有时 release 产物不签名（app-release-unsigned.apk），绝不回退到调试证书。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envKey, String propKey ->
    def fromEnv = System.getenv(envKey)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProps.getProperty(propKey)
}
def releaseStoreFile = signingValue("BLUEOS_KEYSTORE_FILE", "storeFile")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace "icu.liuhua.workshop"
    compileSdk 34

    defaultConfig {
        applicationId "icu.liuhua.workshop"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // 仅用于调试安装测试。这个证书和密码是公开的，不能用于发布。
        debugInstall {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "workshop"
            keyPassword "android"
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("BLUEOS_KEYSTORE_PASSWORD", "storePassword")
                keyAlias signingValue("BLUEOS_KEY_ALIAS", "keyAlias")
                keyPassword signingValue("BLUEOS_KEY_PASSWORD", "keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugInstall
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // 调试包允许连本机/局域网的 http 服务器
            manifestPlaceholders = [usesCleartext: "true"]
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            // 正式包只允许 https
            manifestPlaceholders = [usesCleartext: "false"]
        }
    }
}
