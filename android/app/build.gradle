plugins {
    id "com.android.application"
}

android {
    namespace "icu.liuhua.workshop"
    compileSdk 34

    defaultConfig {
        applicationId "icu.liuhua.workshop"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debugInstall {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "workshop"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugInstall
        }
        release {
            signingConfig signingConfigs.debugInstall
            minifyEnabled false
        }
    }
}
