plugins {
    id "com.android.application"
}

// 正式签名不进仓库。按顺序读取：
// 1. 环境变量 BLUEOS_KEYSTORE_FILE / BLUEOS_KEYSTORE_PASSWORD / BLUEOS_KEY_ALIAS / BLUEOS_KEY_PASSWORD（CI 用 Secrets 注入）
// 2. 环境变量 BLUEOS_KEYSTORE_PROPERTIES 指向的仓库外属性文件（推荐，例如 /workspace/secrets/blueos-work/keystore.properties）
// 3. android/keystore.properties（已在 .gitignore，本地打包用）
// 都没有时 release 产物不签名（app-release-unsigned.apk），绝不回退到调试证书。
def keystoreProps = new Properties()
def externalProps = System.getenv("BLUEOS_KEYSTORE_PROPERTIES")
def keystorePropsFile = (externalProps != null && !externalProps.isEmpty()) ? file(externalProps) : rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envKey, String propKey ->
    def fromEnv = System.getenv(envKey)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProps.getProperty(propKey)
}
def releaseStoreFile = signingValue("BLUEOS_KEYSTORE_FILE", "storeFile")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()
// Optional legacy debug signer remains outside source; without it AGP uses ~/.android/debug.keystore.
def debugStoreFile = System.getenv("BLUEOS_DEBUG_KEYSTORE_FILE")
def hasExternalDebug = debugStoreFile != null && !debugStoreFile.isEmpty()
if (hasExternalDebug) {
    def debugKey = file(debugStoreFile).canonicalFile
    def checkout = rootProject.projectDir.parentFile.canonicalPath + File.separator
    if (!debugKey.exists() || debugKey.canonicalPath.startsWith(checkout)) {
        throw new GradleException("BLUEOS_DEBUG_KEYSTORE_FILE must be an existing file outside the checkout; no silent signer fallback")
    }
}

android {
    namespace "icu.liuhua.workshop"
    compileSdk 34

    defaultConfig {
        applicationId "icu.liuhua.workshop"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.0.1"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // Legacy public debug signer only; never a Release fallback.
        if (hasExternalDebug) {
            debugInstall {
                storeFile file(debugStoreFile)
                storePassword "android"
                keyAlias "workshop"
                keyPassword "android"
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("BLUEOS_KEYSTORE_PASSWORD", "storePassword")
                keyAlias signingValue("BLUEOS_KEY_ALIAS", "keyAlias")
                keyPassword signingValue("BLUEOS_KEY_PASSWORD", "keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            if (hasExternalDebug) {
                signingConfig signingConfigs.debugInstall
            }
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // 调试包允许连本机/局域网的 http 服务器
            manifestPlaceholders = [usesCleartext: "true"]
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            // 正式包只允许 https
            manifestPlaceholders = [usesCleartext: "false"]
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    // android.jar 里的 org.json 在 JVM 单元测试中是空实现，换成真实实现
    testImplementation "org.json:json:20240303"
}

// 内置界面由仓库根目录 `npm run build:android-web` 生成到 assets/www（不进 Git）。
// 缺失时直接报错，避免打出一个没有界面的空壳包。
tasks.register("checkWebAssets") {
    doLast {
        def index = file("src/main/assets/www/index.html")
        if (!index.exists()) {
            throw new GradleException("缺少内置界面 assets/www/index.html：请先在仓库根目录运行 npm ci && npm run build:android-web")
        }
    }
}
preBuild.dependsOn("checkWebAssets")
