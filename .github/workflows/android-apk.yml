name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_SDK_ROOT" -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK and unsigned release APK
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon
      - name: SHA-256
        run: sha256sum android/app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blueos-workshop-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: blueos-workshop-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
